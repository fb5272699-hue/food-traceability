<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食品安全溯源查询</title>
    <style>
        :root { --primary: #059669; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
        .header { background: var(--primary); color: white; padding: 40px 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .container { max-width: 600px; margin: -20px auto 40px; padding: 0 16px; }
        .card { background: var(--card); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .product-item { display: flex; justify-content: space-between; padding: 16px; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; text-decoration: none; color: inherit; }
        .badge { display: inline-block; background: #dcfce7; color: #166534; padding: 4px 12px; border-radius: 20px; font-size: 14px; margin-bottom: 12px; }
        .info-row { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding: 8px 0; }
        .timeline { border-left: 2px solid #e2e8f0; margin-left: 10px; padding-left: 20px; }
        .timeline-step { position: relative; margin-bottom: 16px; }
        .timeline-step::before { content: ''; position: absolute; left: -27px; top: 6px; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; }
        .btn-back { display: block; text-align: center; padding: 12px; background: #e2e8f0; border-radius: 8px; text-decoration: none; color: #475569; margin-top: 20px; }
    </style>
</head>
<body>

<div class="header">
    <h1>食品安全溯源查询</h1>
    <p>扫码查看食品生产、检测与物流信息</p>
</div>

<div class="container" id="app">
    <div class="card">正在加载溯源信息……</div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const app = document.getElementById('app');

    async function loadData() {
        const response = await fetch('products.json');
        const products = await response.json();

        // 1. 如果网址带有 id 参数，显示对应的产品详情
        if (productId) {
            const product = products.find(p => p.id === productId);
            if (!product) {
                app.innerHTML = '<div class="card">未找到该产品信息。</div>';
                return;
            }
            app.innerHTML = `
                <div class="card">
                    <div class="badge">检测结果：${product.testResult}</div>
                    <h2 style="margin-top:0">${product.name}</h2>
                    
                    <h3>一、基本信息</h3>
                    <div class="info-row"><span style="color:#64748b">产品编号</span><span>${product.id}</span></div>
                    <div class="info-row"><span style="color:#64748b">生产批次</span><span>${product.batch}</span></div>
                    <div class="info-row"><span style="color:#64748b">产地</span><span>${product.origin}</span></div>
                    <div class="info-row"><span style="color:#64748b">生产日期</span><span>${product.date}</span></div>
                    
                    <h3>二、物流时间轴</h3>
                    <div class="timeline">
                        ${product.logistics.map(step => `<div class="timeline-step">${step}</div>`).join('')}
                    </div>

                    <h3>三、溯源结论</h3>
                    <p style="color:#166534; background:#f0fdf4; padding:10px; border-radius:8px;">${product.conclusion}</p>
                    
                    <a href="index.html" class="btn-back">返回产品列表</a>
                </div>
            `;
        } 
        // 2. 如果网址没有 id（直接打开首页），显示产品列表
        else {
            let listHtml = '<div class="card"><h3>请选择产品查看溯源信息：</h3>';
            products.forEach(p => {
                listHtml += `
                    <a href="?id=${p.id}" class="product-item">
                        <span style="font-weight:bold">${p.name}</span>
                        <span style="color:#059669">查看详情 &rarr;</span>
                    </a>
                `;
            });
            listHtml += '</div>';
            app.innerHTML = listHtml;
        }
    }

    // 执行函数
    loadData();
</script>

</body>
</html>
